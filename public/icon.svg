<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Bolt Upper Segment Gradient -->
    <linearGradient id="boltUpper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Bolt Lower Segment Gradient -->
    <linearGradient id="boltLower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Core Spine Highlight -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#e0f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.4" />
    </linearGradient>

    <!-- Radial Cyan Ambient Glow -->
    <radialGradient id="ambientCyan" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Floor Glow -->
    <radialGradient id="ambientEmerald" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filters -->
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="outerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#00f2fe" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="220" fill="url(#ambientCyan)" />
  <circle cx="256" cy="380" r="160" fill="url(#ambientEmerald)" />

  <!-- Outer Beveled Shield / Squircle Base -->
  <g filter="url(#outerShadow)">
    <rect
      x="36"
      y="36"
      width="440"
      height="440"
      rx="108"
      fill="url(#bgGrad)"
      stroke="url(#borderGrad)"
      stroke-width="7"
    />
  </g>

  <!-- Inner Cybernetic Framing Line -->
  <rect
    x="52"
    y="52"
    width="408"
    height="408"
    rx="92"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.06"
    stroke-width="2"
  />

  <!-- Subtle Horizon Tech Crosshair Dots -->
  <circle cx="76" cy="76" r="3.5" fill="#00f2fe" opacity="0.6" />
  <circle cx="436" cy="76" r="3.5" fill="#00f2fe" opacity="0.6" />
  <circle cx="76" cy="436" r="3.5" fill="#10b981" opacity="0.6" />
  <circle cx="436" cy="436" r="3.5" fill="#10b981" opacity="0.6" />

  <!-- Mini Horizon Status Pulse Dot in Top-Right -->
  <g transform="translate(390, 80)">
    <circle cx="0" cy="0" r="8" fill="#00f2fe" opacity="0.25" />
    <circle cx="0" cy="0" r="4.5" fill="#00f2fe" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
  </g>

  <!-- Center Gaming Emblem: Dynamic Lightning Bolt + "J" Monogram -->
  <g filter="url(#boltGlow)">
    
    <!-- Outer Cyan Glow Backing for Bolt -->
    <path
      d="M296 68 L144 264 L244 264 L180 444 L368 228 L264 228 Z"
      fill="#00f2fe"
      opacity="0.3"
      filter="blur(16px)"
    />

    <!-- Main Dynamic Bolt Path -->
    <!-- Top sharp point starts at (300, 76), angles down to (148, 272), crossbar to (252, 272), plunge to (188, 440), apex to (364, 224), crossbar to (264, 224) -->
    <path
      d="M298 76 L152 270 L252 270 L188 440 L364 220 L260 220 Z"
      fill="url(#boltUpper)"
    />

    <!-- Lower Accent & Kinetic Wing (Creates the "J" loop & speed blades) -->
    <path
      d="M252 270 L188 440 L280 326 L238 316 Z"
      fill="url(#boltLower)"
    />

    <!-- Stylized "J" Under-Hook Wing -->
    <path
      d="M188 440 Q 150 430 140 390 Q 134 360 156 348 Q 166 344 176 354 Q 186 366 188 440 Z"
      fill="url(#boltLower)"
      opacity="0.85"
    />

    <!-- Razor-Sharp Core White Highlight Spine -->
    <path
      d="M288 100 L176 256 L254 256 L204 400 L340 234 L260 234 Z"
      fill="none"
      stroke="url(#spineGrad)"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Diamond Sparkle Accents on Primary Vertex -->
    <polygon
      points="298,64 304,76 316,82 304,88 298,100 292,88 280,82 292,76"
      fill="#ffffff"
      opacity="0.9"
    />
  </g>
</svg>